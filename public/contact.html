<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | CycleRide</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/app.js"></script>
    <script src="/js/contact.js"></script>
  </head>
  <body>
    <nav class="top-nav">
      <a href="/" class="brand">CycleRide</a>
      <div class="nav-links">
        <a href="/products">Products</a>
        <a href="/cart">Cart <span data-cart-count>0</span></a>
        <a href="/contact">Contact</a>
        <a href="/login">Staff login</a>
      </div>
    </nav>

    <main class="page">
      <section class="section contact-layout">
        <div class="card">
          <h1>Contact us</h1>
          <p class="muted">Tell us about your riding goals and we’ll help you find the perfect setup.</p>
          <form id="contact-form">
            <label>Name<input name="name" required /></label>
            <label>Email<input name="email" type="email" required /></label>
            <label>Subject<input name="subject" required /></label>
            <label>Message<textarea name="message" rows="5" required></textarea></label>
            <button class="btn btn-primary" type="submit">Send message</button>
          </form>
          <p id="contact-message" class="message"></p>
        </div>
        <aside class="summary-card">
          <h2>Visit us</h2>
          <p>Worli Promenade, Mumbai</p>
          <p>+91 98765 43210</p>
          <p>hello@cycleride.com</p>
        </aside>
      </section>
    </main>
  </body>
</html>
