<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="yHYLBuAwUNtGr_dRQ9d9I7st5KHDkEcxXavok15Laro" />
    <title>Products | CycleRide</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/app.js"></script>
  </head>
  <body class="theme-page">
    <nav class="top-nav">
      <a href="/" class="brand">CycleRide</a>
      <div class="nav-links">
        <a href="/products">Products</a>
        <a href="/cart">Cart <span data-cart-count>0</span></a>
        <a href="/contact">Contact</a>
        <a href="/login">Staff login</a>
      </div>
    </nav>

    <main class="page">
      <section class="section">
        <h1>Shop the collection</h1>
        <p class="muted">Explore bikes, accessories, and apparel for every ride.</p>
        <div class="product-grid" id="product-grid"></div>
      </section>
    </main>

    <script>
      const grid = document.getElementById('product-grid');
      grid.innerHTML = window.CycleRide.PRODUCTS.map((product) => `
        <article class="card">
          <div class="card-top">
            <span class="badge">${product.badge}</span>
            <h3>${product.name}</h3>
          </div>
          <p>${product.description}</p>
          <div class="card-footer">
            <strong>${window.CycleRide.formatCurrency(product.price)}</strong>
            <button class="btn btn-primary" data-add-to-cart="${product.id}">Add to cart</button>
          </div>
        </article>
      `).join('');
      window.CycleRide.attachAddToCartButtons();
    </script>
  </body>
</html>
